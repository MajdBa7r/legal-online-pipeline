# Model gateway configuration.
# Stages ask for a ROLE; swapping a model is a change here, not in the pipeline.
#
# CHECK on Day 1: the exact API model ids below are placeholders taken from the
# blueprint names. Copy the real ids from each provider's console / docs, and
# confirm each chat provider accepts OpenAI-style /chat/completions with
# response_format {"type": "json_object"}. Some reasoning models fix
# temperature; if a provider rejects it, set temperature: null.

providers:
  deepseek:
    kind: openai_chat
    base_url: https://api.deepseek.com
    api_key_env: DEEPSEEK_API_KEY
  moonshot:
    kind: openai_chat
    base_url: https://api.moonshot.ai/v1
    api_key_env: MOONSHOT_API_KEY
  openai:
    kind: openai_embed
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
  cohere:
    kind: cohere_rerank
    base_url: https://api.cohere.com/v2
    api_key_env: COHERE_API_KEY

roles:
  # LOCKED for the MVP on 2026-11-17 (scripts/compare_writers.py, logs reviewed): DeepSeek writes, Kimi checks.
  # Thinking is OFF everywhere: with it on, DeepSeek V4 returned empty content or timed out, Kimi was too slow.
  understand:
    provider: deepseek
    model: deepseek-flash             # confirmed via /models on 2026-11-17
    temperature: 0
    max_tokens: 800
    timeout_s: 6
    json_mode: true
    extra_body: {thinking: {type: disabled}}
    fallback: null
  generate:
    provider: deepseek
    model: deepseek-flash             # 4/4 + 4/4 answers, 4.6-15.6 s with whole-law packs
    temperature: 0.2                  # lower than the 0.6 compared, for more consistent answers
    max_tokens: 3000                  # room for up to 8 claims with quotes
    timeout_s: 20
    json_mode: true
    extra_body: {thinking: {type: disabled}}
    fallback: null                    # must NOT be the verify provider
  verify:
    provider: moonshot
    model: kimi-k2.6                  # confirmed via /models on 2026-11-17; 6.6 s for 5 claims
    temperature: null                 # kimi-k2.6 fixes temperature (0.6 with thinking off); do not send it
    max_tokens: 1500
    timeout_s: 12
    json_mode: true
    extra_body: {thinking: {type: disabled}}
    fallback: null
  embed:
    provider: openai
    model: text-embedding-3-large
    dimensions: 1024                  # must match data_versions.embedding_model / chunks.embedding
    timeout_s: 3
  rerank:
    provider: cohere
    model: rerank-v3.5                # CHECK latest multilingual rerank id (not used in the MVP: no key)
    timeout_s: 3
